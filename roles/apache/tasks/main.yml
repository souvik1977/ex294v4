- name: Installing Required web packages
  ansible.builtin.dnf:
    name: [httpd,firewalld]
    state: present
- name: Copy index.html to webroot
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: apache
    group: apache
    mode: '0644'
    setype: httpd_sys_content_t
- name: Starting services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - httpd
    - firewalld
- name: Allowing http over firewalld
  ansible.posix.firewalld:
    service: http
    state: enabled
    immediate: true
    permanent: true
    offline: true
